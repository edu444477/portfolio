<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <title>Eduardo Orellana — Desarrollador Full Stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio de Eduardo Orellana Pomares, desarrollador Full Stack en Marbella. React, React Native, Ruby on Rails, Angular y Flask."
    />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="author" href="/humans.txt" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        Este portfolio necesita JavaScript para las animaciones. Puedes escribirme a
        <a href="mailto:eduardoorellanapomares@gmail.com">eduardoorellanapomares@gmail.com</a>.
      </p>
    </noscript>
  </body>
</html>
