<section class="relative flex min-h-[calc(100dvh-4rem)] items-center overflow-hidden pt-16">
  <div class="pointer-events-none absolute inset-0 grid-bg opacity-60" aria-hidden="true"></div>

  <div class="shell relative py-20">
    <p class="label text-accent-text">Error 404</p>
    <p class="display mt-4 text-[clamp(6rem,22vw,16rem)] leading-none text-line-strong" aria-hidden="true">404</p>
    <h1 class="display mt-4 text-4xl md:text-6xl">{{ content().notFound.title }}</h1>
    <p class="mt-5 max-w-lg text-muted md:text-lg">{{ content().notFound.text }}</p>
    <a class="btn btn-primary mt-8" [href]="content().notFound.cta.href">
      {{ content().notFound.cta.label }}
    </a>
  </div>
</section>
