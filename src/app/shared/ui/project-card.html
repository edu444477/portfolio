<article
  class="group grid gap-4 border-t border-line px-2 py-8 transition-colors hover:bg-accent-soft md:grid-cols-[3.5rem_1fr_auto] md:gap-8 md:px-4"
>
  <span class="label md:pt-1">{{ project().index }}</span>

  <div>
    <p class="label">{{ project().kicker }}</p>
    <h3 class="mt-2 font-display text-2xl font-semibold tracking-tight md:text-3xl">
      {{ project().title }}
    </h3>
    <p class="mt-3 max-w-xl text-sm leading-relaxed text-muted">{{ project().summary }}</p>
    <div class="mt-4 flex flex-wrap gap-1.5">
      @for (tech of project().stack; track tech) {
        <app-tag [label]="tech" />
      }
    </div>
  </div>

  <div class="flex flex-wrap items-start gap-x-5 gap-y-2 md:flex-col md:items-end">
    @for (link of project().links; track link.href) {
      @if (link.external) {
        <a
          [href]="link.href"
          target="_blank"
          rel="noopener noreferrer"
          class="link-arrow"
        >
          {{ link.label }}
          <span aria-hidden="true">↗</span>
        </a>
      } @else {
        <a [routerLink]="link.href" class="link-arrow">
          {{ link.label }}
          <span aria-hidden="true">→</span>
        </a>
      }
    }
  </div>
</article>
