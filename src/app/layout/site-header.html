<header
  class="fixed inset-x-0 top-0 z-50 border-b border-line bg-bg/85 backdrop-blur-md"
>
  <div class="shell flex h-16 items-center justify-between gap-3">
    <a
      [href]="homeHref()"
      class="group flex items-center gap-3"
    >
      <span
        class="grid h-9 w-9 place-items-center border border-line-strong font-mono text-[11px] tracking-[0.08em] transition-colors group-hover:border-accent group-hover:text-accent-text"
        aria-hidden="true"
        >EO</span
      >
      <span class="sr-only text-sm font-medium tracking-tight sm:not-sr-only">Eduardo Orellana</span>
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Principal">
      @for (item of content().nav; track item.href) {
        <a
          [href]="item.href"
          class="label transition-colors hover:text-ink"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="flex items-center gap-1.5">
      <div
        class="mr-1 flex items-center gap-1 border-r border-line pr-2 font-mono text-[11px] tracking-[0.1em]"
        role="group"
        aria-label="Idioma / Language"
      >
        <a
          href="/"
          class="px-1 py-1 transition-colors"
          [class.text-ink]="language.lang() === 'es'"
          [class.text-muted]="language.lang() !== 'es'"
          [attr.aria-current]="language.lang() === 'es' ? 'true' : null"
          >ES</a
        >
        <span class="text-line-strong" aria-hidden="true">/</span>
        <a
          [href]="altHref()"
          class="px-1 py-1 transition-colors"
          [class.text-ink]="language.lang() === 'en'"
          [class.text-muted]="language.lang() !== 'en'"
          [attr.aria-current]="language.lang() === 'en' ? 'true' : null"
          >EN</a
        >
      </div>

      <button
        type="button"
        class="grid h-9 w-9 place-items-center border border-transparent text-muted transition-colors hover:border-line hover:text-ink"
        [attr.aria-label]="content().header.theme"
        (click)="theme.toggle()"
      >
        @if (theme.theme() === 'dark') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="grid h-9 w-9 place-items-center border border-line text-ink lg:hidden"
        [attr.aria-label]="menuOpen() ? content().header.close : content().header.menu"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="m5 5 14 14M19 5 5 19" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M3 7h18M3 12h18M3 17h18" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div class="h-px w-full bg-line">
    <div
      class="h-px origin-left bg-accent transition-transform duration-150"
      [style.transform]="'scaleX(' + progress() + ')'"
    ></div>
  </div>
</header>

@if (menuOpen()) {
  <div
    id="mobile-menu"
    class="fixed inset-0 top-16 z-40 overflow-y-auto bg-bg lg:hidden"
  >
    <nav class="shell flex flex-col py-6" aria-label="Móvil">
      @for (item of content().nav; track item.href; let i = $index) {
        <a
          [href]="item.href"
          class="flex items-baseline justify-between border-b border-line py-5"
          (click)="menuOpen.set(false)"
        >
          <span class="font-display text-3xl font-semibold tracking-tight">{{ item.label }}</span>
          <span class="label">0{{ i + 1 }}</span>
        </a>
      }
    </nav>

    <div class="shell flex flex-col gap-2 pb-10">
      <span class="label">{{ content().header.status }}</span>
      <a
        class="text-sm text-muted"
        href="mailto:eduardoorellanapomares@gmail.com"
        >eduardoorellanapomares@gmail.com</a
      >
      <div class="mt-4 flex gap-4">
        <a class="link-arrow" href="https://github.com/edu444477" target="_blank" rel="noopener"
          >GitHub</a
        >
        <a
          class="link-arrow"
          href="https://www.linkedin.com/in/eduardoorellanapomares/"
          target="_blank"
          rel="noopener"
          >LinkedIn</a
        >
      </div>
    </div>
  </div>
}
