<footer class="border-t border-line">
  <div class="shell py-12 md:py-16">
    <div class="grid gap-10 md:grid-cols-[1fr_auto] md:items-start">
      <div>
        <p class="display text-3xl md:text-4xl">Eduardo Orellana</p>
        <p class="mt-3 max-w-sm text-sm text-muted">{{ content().footer.note }}</p>
      </div>

      <nav class="flex flex-wrap gap-x-8 gap-y-3 md:justify-end" aria-label="Footer">
        @for (link of content().footer.links; track link.href) {
          @if (link.external) {
            <a
              [href]="link.href"
              target="_blank"
              rel="noopener noreferrer"
              class="label transition-colors hover:text-ink"
              >{{ link.label }}</a
            >
          } @else {
            <a [href]="link.href" class="label transition-colors hover:text-ink">{{ link.label }}</a>
          }
        }
      </nav>
    </div>

    <div
      class="mt-12 flex flex-col gap-4 border-t border-line pt-6 md:flex-row md:items-center md:justify-between"
    >
      <span class="label">{{ content().footer.built }}</span>
      <span class="label">{{ content().footer.copyright }}</span>
      <button type="button" class="label text-left transition-colors hover:text-ink md:text-right" (click)="scrollTop($event)">
        {{ content().footer.backToTop }} ↑
      </button>
    </div>
  </div>
</footer>
